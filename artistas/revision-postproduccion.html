<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pavoneo 360 · Revisión de postproducción</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,900&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#F7F2E5; --cream2:#FFF8E8;
  --ink:#071C48; --ink-mid:#24406E; --ink-light:#6A7EA6;
  --blue:#0757D8; --blue-deep:#043C9F; --blue-soft:#EAF2FF; --teal-l:#3E83FF;
  --gold:#E8B83E; --gold-pale:#FFF5D7; --terra:#D59A18;
  --green:#1E8A5E; --green-pale:#E8F7F1;
  --red:#C0392B; --red-pale:#FBEAEA;
  --border:#D8E3F5;
  --sh:0 10px 28px rgba(7,28,72,.07); --sh-md:0 18px 52px rgba(7,28,72,.13);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#f8fbff 0%,#fff 44%,#fff8e8 100%);color:var(--ink);font-size:15px;line-height:1.6;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:840px;margin:0 auto;padding:28px 22px 90px}

.masthead{background:linear-gradient(135deg,#071C48 0%,#0B3E9A 60%,#0757D8 100%);color:#fff;padding:32px 38px 26px;border-radius:18px;margin-bottom:20px;position:relative;overflow:hidden;box-shadow:var(--sh-md)}
.masthead::before{content:'🎚️';position:absolute;right:38px;top:50%;transform:translateY(-50%);font-size:70px;opacity:.12}
.mh-eye{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:8px}
.mh-title{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.01em;margin-bottom:8px}
.mh-title em{color:var(--gold);font-style:italic}
.mh-sub{font-size:13px;color:rgba(255,255,255,.72);max-width:560px}

.bar{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 18px;box-shadow:var(--sh);margin-bottom:22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mode-pill{border:1px solid var(--border);background:var(--cream2);color:var(--ink-mid);border-radius:20px;padding:8px 14px;font-size:11.5px;font-weight:800;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:9px;padding:10px 18px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.15s;margin-left:auto}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.saved-note{font-size:11.5px;font-weight:700;width:100%}
.saved-note.ok{color:var(--green)} .saved-note.err{color:var(--red)} .saved-note.local{color:var(--ink-light)}

.empty-state{background:#fff;border:1px dashed var(--border);border-radius:14px;padding:50px 20px;text-align:center;color:var(--ink-light)}

.song-card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh);padding:20px 22px;margin-bottom:18px}
.song-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.song-eyebrow{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);font-weight:800;margin-bottom:3px}
.song-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700}
.song-office-controls{display:flex;gap:6px}

.media-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.media-tab{border:1px solid var(--border);background:#fff;color:var(--ink-mid);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:800;cursor:pointer}
.media-tab.selected{border-color:var(--blue);background:var(--blue);color:#fff}
.media-tab-add{border-style:dashed;color:var(--blue);background:var(--blue-soft)}
.no-media{background:var(--cream2);border:1px dashed var(--border);border-radius:10px;padding:16px;text-align:center;color:var(--ink-light);font-size:13px}

.version-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ver-tab{border:1px solid var(--border);background:#fff;color:var(--ink-mid);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.ver-tab.selected{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-deep)}
.ver-tab .ver-dot{color:var(--green);font-size:9px}
.ver-tab-add{border-style:dashed;color:var(--blue)}

.version-meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.meta-box{background:var(--cream2);border:1px solid var(--border);border-radius:9px;padding:6px 12px;min-width:110px}
.meta-label{display:block;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-light);font-weight:800}
.meta-value{display:block;font-size:13px;font-weight:700;color:var(--blue-deep)}

.old-version-banner{background:var(--blue-soft);border:1px solid var(--blue);color:var(--blue-deep);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* --- audio --- */
.player{margin-bottom:14px}
.transport{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.play-btn{width:38px;height:38px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(7,87,216,.3);flex-shrink:0}
.time-cur{font-size:18px;font-weight:300;color:var(--blue);font-variant-numeric:tabular-nums}
.time-sep{font-size:12px;color:var(--ink-light)}
.time-dur{font-size:12px;color:var(--ink-light);font-variant-numeric:tabular-nums}
.volume{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:13px}
.volume input{width:80px}
.wave-wrap{position:relative;height:64px;margin-top:20px}
.wave-canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:8px;background:var(--blue-soft);display:block}
.seek-range{position:absolute;inset:0;width:100%;height:100%;margin:0;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;z-index:2}
.seek-range::-webkit-slider-runnable-track{background:transparent;height:64px}
.seek-range::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:64px;background:var(--blue);box-shadow:0 0 6px rgba(7,87,216,.6);border-radius:2px;cursor:pointer}
.seek-range::-moz-range-track{background:transparent;height:64px;border:none}
.seek-range::-moz-range-thumb{width:3px;height:64px;background:var(--blue);border:none;border-radius:2px;cursor:pointer}
.audio-error{background:var(--red-pale);border:1px solid var(--red);color:var(--red);border-radius:10px;padding:14px 16px;font-size:12.5px;margin-bottom:12px}
.audio-error code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px}

/* --- vídeo --- */
.yt-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:10px;overflow:hidden;background:#000;margin-bottom:14px}
.yt-wrap > div{position:absolute;inset:0}
.yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mini-timeline{position:relative;height:30px;margin-bottom:12px}
.mini-track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--blue-soft);cursor:pointer}
.video-error{background:var(--red-pale);border:1px solid var(--red);color:var(--red);border-radius:10px;padding:14px 16px;font-size:12.5px;margin-bottom:12px}
.video-error code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px}

/* --- marcadores (compartido audio/vídeo) --- */
.markers-row{position:absolute;top:-16px;left:0;right:0;height:16px}
.mini-timeline .markers-row{top:0;height:20px}
.marker-pin{position:absolute;transform:translateX(-50%);top:0;width:19px;height:19px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(7,28,72,.3);padding:0}

.btn-add-marker{display:inline-block;border:1px dashed var(--blue);background:var(--blue-soft);color:var(--blue-deep);border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:800;cursor:pointer;margin-bottom:12px}

.add-marker-form{background:var(--cream2);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.form-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.form-time{font-weight:800;color:var(--terra);font-size:13px}
.add-marker-form select,.c-edit-body select{border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:#fff}
.add-marker-form textarea,.c-edit-body textarea{width:100%;min-height:56px;border:1px solid var(--border);border-radius:8px;padding:9px;resize:vertical;outline:none;background:#fff}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.btn-mini{border:1px solid var(--border);background:#fff;color:var(--ink-light);border-radius:7px;padding:7px 13px;font-size:11.5px;font-weight:700;cursor:pointer}
.btn-mini-primary{background:var(--blue);border-color:var(--blue);color:#fff}

.comments-list{display:flex;flex-direction:column;gap:8px}
.no-comments{color:var(--ink-light);font-size:12.5px;padding:10px 2px}
.comment-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;flex-wrap:wrap}
.comment-row.editing{align-items:flex-start;background:var(--cream2)}
.c-num{width:24px;height:24px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.c-time{font-weight:800;color:var(--ink-mid);font-variant-numeric:tabular-nums;min-width:40px;cursor:pointer}
.c-time:hover{color:var(--blue)}
.c-tag{font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px;flex-shrink:0}
.c-text{flex:1;min-width:160px;font-size:13px}
.c-actions{display:flex;gap:4px;margin-left:auto}
.icon-btn{border:1px solid var(--border);background:#fff;border-radius:6px;width:28px;height:28px;font-size:12px;cursor:pointer;color:var(--ink-light)}
.icon-btn:hover{color:var(--ink)}
.c-edit-body{flex:1;min-width:220px}

.btn-add-song{display:block;width:100%;border:1.5px dashed var(--blue);background:#fff;color:var(--blue);border-radius:12px;padding:14px;font-size:13px;font-weight:800;cursor:pointer}

.footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--ink-light);text-align:center}
#loading{text-align:center;padding:60px 0;color:var(--ink-light)}
@media(max-width:600px){
  .masthead{padding:24px 20px}
  .mh-title{font-size:23px}
  .btn{margin-left:0;width:100%;justify-content:center}
  .mode-pill{width:100%;text-align:center}
  .volume{margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading">Cargando revisión de postproducción…</div>
  <div id="app" style="display:none">

    <div class="masthead">
      <div class="mh-eye">Pavoneo 360° · Artes Búho</div>
      <div class="mh-title">Revisión de <em>postproducción</em></div>
      <div class="mh-sub" id="mhSub">Escucha cada mezcla y mira cada corte — déjanos tus notas justo en el segundo que quieras cambiar.</div>
    </div>

    <div class="bar">
      <button type="button" class="mode-pill" id="modeToggle" onclick="toggleMode()">🔐 Modo oficina</button>
      <button type="button" class="btn btn-blue" id="btnGuardar" onclick="guardar()">☁ Enviar cambios al equipo</button>
      <span class="saved-note" id="savedNote"></span>
    </div>

    <div id="songsWrap"></div>

    <div class="footer"><strong>Artes Búho</strong> · artesbuho.oficial@gmail.com · Pavoneo 360°</div>
  </div>
</div>

<script>
// Publicador Google Apps Script (misma URL /exec que usa la oficina). Vacío = solo local.
const WEBHOOK = 'https://script.google.com/macros/s/AKfycbz2gTZgugtG4hi2Ju7KRryZrOO24-CNDEzylyMjVGuR9cDJ3N1r1zRbrm7QM4UjM2o-gg/exec';
const OFFICE_PASSWORD = 'pavoneo360';
const OFFICE_UNLOCK_KEY = 'pavoneo360-office-unlocked';
const AUDIO_CATEGORIES = [
  { id:'instrumental', label:'Instrumental', color:'#0757D8', bg:'#EAF2FF' },
  { id:'voz',          label:'Voz',          color:'#D59A18', bg:'#FFF5D7' },
  { id:'bateria',      label:'Batería',      color:'#C0392B', bg:'#FBEAEA' },
  { id:'mezcla',       label:'Mezcla / Máster', color:'#1E8A5E', bg:'#E8F7F1' },
  { id:'general',      label:'General',      color:'#6A7EA6', bg:'#EEF2F9' }
];
const VIDEO_CATEGORIES = [
  { id:'edicion', label:'Edición',          color:'#0757D8', bg:'#EAF2FF' },
  { id:'color',   label:'Color / Imagen',   color:'#D59A18', bg:'#FFF5D7' },
  { id:'audiovid',label:'Audio',            color:'#C0392B', bg:'#FBEAEA' },
  { id:'ritmo',   label:'Ritmo / Montaje',  color:'#1E8A5E', bg:'#E8F7F1' },
  { id:'general', label:'General',          color:'#6A7EA6', bg:'#EEF2F9' }
];

let artistId = new URLSearchParams(location.search).get('id') || '';
let expediente = null;
let songs = [];
let officeMode = false;
let pendingMarker = {};
let editingComment = {};
let selectedMedia = {};   // idx -> 'audio' | 'video'
let selectedVersion = {}; // idx -> id de la versión que se está viendo dentro del media actual
let ytPlayers = {};       // idx -> instancia YT.Player montada (solo cuando el media actual es vídeo)
let ytApiReady = false;
let ytApiReadyCallbacks = [];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(s){ s = Math.max(0, Math.floor(Number(s)||0)); const m = Math.floor(s/60), sec = s%60; return m+':'+String(sec).padStart(2,'0'); }
function escapeHtml(value){
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function stripTransient(song){
  const clean = Object.assign({}, song);
  ['audio','video'].forEach(type => {
    if(clean[type]){
      clean[type] = Object.assign({}, clean[type], {
        versions: (clean[type].versions || []).map(v => { const c = Object.assign({}, v); delete c._duration; return c; })
      });
    }
  });
  return clean;
}
function parseYouTubeId(input){
  input = String(input || '').trim();
  if(!input) return '';
  if(/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
  const m = input.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : input;
}
function resolveAudioSrc(ver){
  if(!ver || !ver.audioFile) return '';
  if(/^https?:\/\//i.test(ver.audioFile)) return ver.audioFile;
  return artistId + '/audio/' + ver.audioFile;
}
function defaultMedia(song){
  if(!song) return 'audio';
  if(song.audio) return 'audio';
  if(song.video) return 'video';
  return 'audio';
}
function currentMediaType(idx){ return selectedMedia[idx] || defaultMedia(songs[idx]); }
function getMediaBlock(idx){
  const song = songs[idx];
  if(!song) return null;
  return song[currentMediaType(idx)] || null;
}
function getSelectedVersion(idx){
  const block = getMediaBlock(idx);
  if(!block || !block.versions || !block.versions.length) return null;
  const selId = selectedVersion[idx] || block.activeVersionId;
  return block.versions.find(v => v.id === selId) || block.versions[block.versions.length - 1];
}
function isActiveVersion(idx){
  const block = getMediaBlock(idx);
  const ver = getSelectedVersion(idx);
  return !!(block && ver && ver.id === block.activeVersionId);
}
function categoriesFor(idx){ return currentMediaType(idx) === 'video' ? VIDEO_CATEGORIES : AUDIO_CATEGORIES; }
function categoryOf(idx, id){ const cats = categoriesFor(idx); return cats.find(c => c.id === id) || cats[cats.length - 1]; }
function officeUnlocked(){ return sessionStorage.getItem(OFFICE_UNLOCK_KEY) === 'true'; }

/* ---- API de YouTube (carga perezosa, una sola vez) ---- */
function loadYouTubeApi(){
  if(window.YT && window.YT.Player){ ytApiReady = true; return; }
  if(document.getElementById('yt-iframe-api')) return;
  const tag = document.createElement('script');
  tag.id = 'yt-iframe-api';
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = function(){
    ytApiReady = true;
    ytApiReadyCallbacks.forEach(cb => cb());
    ytApiReadyCallbacks = [];
  };
}
function destroyPlayer(idx){
  if(ytPlayers[idx]){
    try{ ytPlayers[idx].destroy(); }catch(e){}
    delete ytPlayers[idx];
  }
}
function mountPlayer(idx){
  const ver = getSelectedVersion(idx);
  if(!ver || !ver.youtubeId) return;
  const elId = 'yt-embed-' + idx;
  const create = () => {
    if(!document.getElementById(elId)) return;
    destroyPlayer(idx);
    ytPlayers[idx] = new YT.Player(elId, {
      videoId: ver.youtubeId,
      playerVars: { rel:0, modestbranding:1 },
      events: {
        onReady: () => onPlayerReady(idx),
        onStateChange: () => onPlayerStateChange(idx),
        onError: (e) => onPlayerError(idx, e)
      }
    });
  };
  if(ytApiReady) create(); else ytApiReadyCallbacks.push(create);
}
function onPlayerReady(idx){
  const ver = getSelectedVersion(idx);
  const player = ytPlayers[idx];
  if(ver && player && player.getDuration){
    const dur = player.getDuration();
    if(dur) ver._duration = dur;
  }
  renderMarkers(idx);
}
function onPlayerStateChange(idx){
  const ver = getSelectedVersion(idx);
  const player = ytPlayers[idx];
  if(ver && player && player.getDuration){
    const dur = player.getDuration();
    if(dur && dur !== ver._duration){ ver._duration = dur; renderMarkers(idx); }
  }
}
function onPlayerError(idx, e){
  const codes = { 2:'ID de vídeo inválido', 5:'Error del reproductor (a veces pasa mientras YouTube aún está procesando un vídeo recién subido — reinténtalo en unos minutos)', 100:'Vídeo no encontrado o eliminado', 101:'El propietario no permite reproducirlo fuera de YouTube', 150:'El propietario no permite reproducirlo fuera de YouTube' };
  const card = document.querySelectorAll('.song-card')[idx];
  const wrap = card && card.querySelector('.yt-wrap');
  if(wrap) wrap.outerHTML = `<div class="video-error">⚠ No se pudo cargar el vídeo (${escapeHtml(codes[e.data] || 'error ' + e.data)}). Comprueba el enlace de YouTube y que el vídeo esté en modo <code>Oculto</code> (no <code>Privado</code>).</div>`;
}
function miniSeek(event, idx){
  const ver = getSelectedVersion(idx);
  const player = ytPlayers[idx];
  const dur = ver && ver._duration;
  if(!dur || !player || !player.seekTo) return;
  const rect = event.currentTarget.getBoundingClientRect();
  const pct = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
  player.seekTo(pct * dur, true);
}
function seekTo(idx, t){
  if(currentMediaType(idx) === 'video'){
    const player = ytPlayers[idx];
    if(player && player.seekTo) player.seekTo(t, true);
  }else{
    const a = document.querySelector(`audio.audio-el[data-idx="${idx}"]`);
    const seek = document.querySelector(`.seek-range[data-idx="${idx}"]`);
    if(a) a.currentTime = t;
    if(seek) seek.value = t;
    const cur = document.querySelector(`.time-cur[data-idx="${idx}"]`);
    if(cur) cur.textContent = fmt(t);
  }
}

async function init(){
  loadYouTubeApi();
  if(artistId){
    try{
      const r = await fetch(`../data/artistas/${artistId}.json?t=${Date.now()}`, { cache:'no-store' });
      if(r.ok) expediente = await r.json();
    }catch(e){ console.warn(e); }
  }
  songs = (expediente && expediente.songReviews) || [];
  if(expediente){
    document.getElementById('mhSub').textContent =
      `Hola, ${expediente.displayName} 👋 — escucha cada mezcla y mira cada corte, y déjanos tus notas justo en el segundo que quieras cambiar.`;
  }
  if(new URLSearchParams(location.search).get('modo') === 'oficina' && officeUnlocked()) officeMode = true;

  render();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

function toggleMode(){
  if(officeMode){ officeMode = false; selectedVersion = {}; render(); return; }
  if(officeUnlocked()){ officeMode = true; selectedVersion = {}; render(); return; }
  const pass = window.prompt('Clave de oficina');
  if(pass === OFFICE_PASSWORD){
    sessionStorage.setItem(OFFICE_UNLOCK_KEY, 'true');
    officeMode = true; selectedVersion = {}; render();
  }else if(pass !== null){
    alert('Clave incorrecta');
  }
}

function render(){
  Object.keys(ytPlayers).forEach(idx => destroyPlayer(idx));
  const wrap = document.getElementById('songsWrap');
  if(!songs.length && !officeMode){
    wrap.innerHTML = `<div class="empty-state">🎚️ Aún no hay canciones en revisión.<br>En cuanto la oficina suba el primer mix o corte, aparecerá aquí.</div>`;
  }else{
    wrap.innerHTML = songs.map((s,i) => renderSongCard(i)).join('') +
      (officeMode ? `<button type="button" class="btn-add-song" onclick="addSong()">+ Añadir canción</button>` : '');
  }
  songs.forEach((s,i) => mountCardMedia(i));
  document.getElementById('modeToggle').textContent = officeMode ? '👤 Ver como artista' : '🔐 Modo oficina';
}

function mountCardMedia(idx){
  const type = currentMediaType(idx);
  if(type === 'audio'){
    const cv = document.querySelectorAll('.song-card')[idx]?.querySelector('.wave-canvas');
    if(cv) drawWave(cv, hashStr(cv.dataset.seed || ''));
  }else{
    mountPlayer(idx);
  }
  updateCommentsList(idx);
  const ver = getSelectedVersion(idx);
  if(ver && ver._duration) renderMarkers(idx);
}

function refreshSongCard(idx){
  destroyPlayer(idx);
  const el = document.getElementById('song-card-' + idx);
  if(!el) return;
  el.innerHTML = renderSongCardInner(idx);
  mountCardMedia(idx);
}

/* ---- waveform decorativo (determinista, sin decodificar audio) ---- */
function hashStr(s){
  let h = 0; s = String(s || '');
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h) || 1;
}
function drawWave(canvas, seed){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  const barW = 3, gap = 2, n = Math.floor(w/(barW+gap));
  for(let i=0;i<n;i++){
    const r = Math.abs(Math.sin((seed + i*13.37) * 12.9898) * 43758.5453) % 1;
    const amp = 0.2 + 0.8 * Math.abs(Math.sin(i*0.24 + seed*0.001)) * (0.55 + 0.45*r);
    const bh = Math.max(3, amp*h);
    ctx.fillStyle = 'rgba(7,87,216,.24)';
    ctx.fillRect(i*(barW+gap), (h-bh)/2, barW, bh);
  }
}

/* ---- transporte de audio ---- */
function togglePlay(idx){
  const a = document.querySelector(`audio.audio-el[data-idx="${idx}"]`);
  if(!a) return;
  if(a.paused){
    document.querySelectorAll('audio.audio-el').forEach(el => { if(el !== a) el.pause(); });
    a.play();
  }else{
    a.pause();
  }
}
function setPlayIcon(idx, playing){
  const btn = document.querySelector(`.play-btn[data-idx="${idx}"]`);
  if(btn) btn.textContent = playing ? '⏸' : '▶';
}
function onTimeUpdate(idx, audioEl){
  const cur = document.querySelector(`.time-cur[data-idx="${idx}"]`);
  if(cur) cur.textContent = fmt(audioEl.currentTime);
  const seek = document.querySelector(`.seek-range[data-idx="${idx}"]`);
  if(seek && document.activeElement !== seek) seek.value = audioEl.currentTime;
}
function onAudioReady(idx, audioEl){
  const dur = audioEl.duration || 0;
  const durEl = document.querySelector(`.time-dur[data-idx="${idx}"]`);
  if(durEl) durEl.textContent = fmt(dur);
  const seek = document.querySelector(`.seek-range[data-idx="${idx}"]`);
  if(seek) seek.max = dur || 100;
  const ver = getSelectedVersion(idx);
  if(ver) ver._duration = dur;
  renderMarkers(idx);
}
function onAudioError(idx){
  const wrap = document.querySelectorAll('.song-card')[idx]?.querySelector('.player');
  const ver = getSelectedVersion(idx);
  if(wrap) wrap.innerHTML = `<div class="audio-error">⚠ No se pudo cargar el audio. Comprueba que el archivo esté subido en <code>${escapeHtml(artistId)}/audio/${escapeHtml((ver && ver.audioFile)||'')}</code>.</div>`;
}
function seekInput(idx, val){
  const a = document.querySelector(`audio.audio-el[data-idx="${idx}"]`);
  if(a) a.currentTime = parseFloat(val);
  const cur = document.querySelector(`.time-cur[data-idx="${idx}"]`);
  if(cur) cur.textContent = fmt(val);
}
function volInput(idx, val){
  const a = document.querySelector(`audio.audio-el[data-idx="${idx}"]`);
  if(a) a.volume = parseFloat(val);
}

/* ---- marcadores (comentarios por segundo, compartido audio/vídeo) ---- */
function renderMarkers(idx){
  const ver = getSelectedVersion(idx);
  if(!ver) return;
  const dur = ver._duration || 0;
  const row = document.querySelector(`.markers-row[data-idx="${idx}"]`);
  if(!row) return;
  if(!dur){ row.innerHTML = ''; return; }
  const sorted = (ver.comments || []).slice().sort((a,b) => a.time - b.time);
  row.innerHTML = sorted.map((c,i) => {
    const cat = categoryOf(idx, c.category);
    const pct = Math.min(100, Math.max(0, (c.time/dur)*100));
    return `<button type="button" class="marker-pin" style="left:${pct}%;background:${cat.color}" title="${escapeHtml(fmt(c.time)+' · '+cat.label+': '+c.text)}" onclick="seekTo(${idx},${c.time})">${i+1}</button>`;
  }).join('');
}

function startAddMarker(idx){
  if(!isActiveVersion(idx)) return;
  let t = 0;
  if(currentMediaType(idx) === 'video'){
    const player = ytPlayers[idx];
    t = (player && player.getCurrentTime) ? Math.round(player.getCurrentTime()*10)/10 : 0;
  }else{
    const a = document.querySelector(`audio.audio-el[data-idx="${idx}"]`);
    t = a ? Math.round(a.currentTime*10)/10 : 0;
  }
  pendingMarker[idx] = { time:t, category:'general', text:'' };
  renderAddMarkerForm(idx);
}
function cancelAddMarker(idx){ delete pendingMarker[idx]; renderAddMarkerForm(idx); }
function updatePendingMarker(idx, field, value){ if(pendingMarker[idx]) pendingMarker[idx][field] = value; }
function saveMarker(idx){
  if(!isActiveVersion(idx)) return;
  const pm = pendingMarker[idx];
  if(!pm) return;
  if(!pm.text || !pm.text.trim()){ alert('Escribe una recomendación antes de guardar.'); return; }
  const ver = getSelectedVersion(idx);
  if(!ver.comments) ver.comments = [];
  ver.comments.push({ id:uid(), time:pm.time, category:pm.category, text:pm.text.trim(), createdAt:new Date().toISOString().slice(0,10) });
  delete pendingMarker[idx];
  renderAddMarkerForm(idx);
  updateCommentsList(idx);
  renderMarkers(idx);
  noteChanged();
}
function renderAddMarkerForm(idx){
  const el = document.querySelector(`.add-marker-form[data-idx="${idx}"]`);
  if(!el) return;
  const pm = pendingMarker[idx];
  if(!pm){ el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  const cats = categoriesFor(idx);
  el.innerHTML = `
    <div class="form-row">
      <span class="form-time">En ${fmt(pm.time)}</span>
      <select onchange="updatePendingMarker(${idx},'category',this.value)">
        ${cats.map(c => `<option value="${c.id}" ${c.id===pm.category?'selected':''}>${c.label}</option>`).join('')}
      </select>
    </div>
    <textarea placeholder="Escribe tu recomendación..." oninput="updatePendingMarker(${idx},'text',this.value)">${escapeHtml(pm.text)}</textarea>
    <div class="form-actions">
      <button type="button" class="btn-mini" onclick="cancelAddMarker(${idx})">Cancelar</button>
      <button type="button" class="btn-mini btn-mini-primary" onclick="saveMarker(${idx})">Guardar marcador</button>
    </div>`;
}

/* ---- listado / edición de comentarios (solo en la versión activa) ---- */
function updateCommentsList(idx){
  const el = document.querySelector(`.comments-list[data-idx="${idx}"]`);
  if(!el) return;
  const ver = getSelectedVersion(idx);
  if(!ver) return;
  const isActive = isActiveVersion(idx);
  const sorted = (ver.comments || []).slice().sort((a,b) => a.time - b.time);
  if(!sorted.length){
    el.innerHTML = `<div class="no-comments">${isActive ? 'Aún no hay recomendaciones. Reproduce y toca "+ Añadir marcador" en el momento exacto.' : 'No se dejaron recomendaciones en esta versión.'}</div>`;
    return;
  }
  el.innerHTML = sorted.map((c,i) => {
    const cat = categoryOf(idx, c.category);
    if(isActive && editingComment[idx] && editingComment[idx].id === c.id){
      const ed = editingComment[idx];
      const cats = categoriesFor(idx);
      return `<div class="comment-row editing">
        <div class="c-num" style="background:${cat.color}">${i+1}</div>
        <div class="c-time">${fmt(c.time)}</div>
        <div class="c-edit-body">
          <select onchange="updateEditField(${idx},'category',this.value)">
            ${cats.map(x => `<option value="${x.id}" ${x.id===ed.category?'selected':''}>${x.label}</option>`).join('')}
          </select>
          <textarea oninput="updateEditField(${idx},'text',this.value)">${escapeHtml(ed.text)}</textarea>
          <div class="form-actions">
            <button type="button" class="btn-mini" onclick="cancelEditComment(${idx})">Cancelar</button>
            <button type="button" class="btn-mini btn-mini-primary" onclick="saveEditComment(${idx})">Guardar</button>
          </div>
        </div>
      </div>`;
    }
    return `<div class="comment-row">
      <div class="c-num" style="background:${cat.color}">${i+1}</div>
      <div class="c-time" onclick="seekTo(${idx},${c.time})" title="Ir a este momento">${fmt(c.time)}</div>
      <span class="c-tag" style="background:${cat.bg};color:${cat.color}">${cat.label}</span>
      <div class="c-text">${escapeHtml(c.text)}</div>
      ${isActive ? `<div class="c-actions">
        <button type="button" class="icon-btn" onclick="startEditComment(${idx},'${c.id}')" title="Editar">✎</button>
        <button type="button" class="icon-btn" onclick="deleteComment(${idx},'${c.id}')" title="Eliminar">🗑</button>
      </div>` : ''}
    </div>`;
  }).join('');
}
function startEditComment(idx, cid){
  if(!isActiveVersion(idx)) return;
  const ver = getSelectedVersion(idx);
  const c = (ver.comments || []).find(x => x.id === cid);
  if(!c) return;
  editingComment[idx] = { id:cid, category:c.category, text:c.text };
  updateCommentsList(idx);
}
function cancelEditComment(idx){ delete editingComment[idx]; updateCommentsList(idx); }
function updateEditField(idx, field, value){ if(editingComment[idx]) editingComment[idx][field] = value; }
function saveEditComment(idx){
  if(!isActiveVersion(idx)) return;
  const ed = editingComment[idx];
  if(!ed) return;
  if(!ed.text || !ed.text.trim()){ alert('El comentario no puede quedar vacío.'); return; }
  const ver = getSelectedVersion(idx);
  const c = (ver.comments || []).find(x => x.id === ed.id);
  if(c){ c.category = ed.category; c.text = ed.text.trim(); }
  delete editingComment[idx];
  updateCommentsList(idx);
  renderMarkers(idx);
  noteChanged();
}
function deleteComment(idx, cid){
  if(!isActiveVersion(idx)) return;
  if(!confirm('¿Eliminar esta recomendación?')) return;
  const ver = getSelectedVersion(idx);
  ver.comments = (ver.comments || []).filter(x => x.id !== cid);
  updateCommentsList(idx);
  renderMarkers(idx);
  noteChanged();
}

/* ---- modo oficina: alta/edición/baja de canciones, medios y versiones ---- */
function addSong(){
  const nombre = prompt('Nombre de la canción');
  if(!nombre) return;
  songs.push({ id:uid(), songName:nombre.trim(), audio:null, video:null });
  noteChanged();
  render();
}
function startEditSong(idx){
  const s = songs[idx];
  const nombre = prompt('Nombre de la canción', s.songName || '');
  if(nombre === null) return;
  s.songName = nombre.trim();
  refreshSongCard(idx);
  noteChanged();
}
function deleteSong(idx){
  if(!confirm('¿Eliminar esta canción entera (audio, vídeo y todas sus recomendaciones)? No se puede deshacer.')) return;
  songs.splice(idx,1);
  delete selectedMedia[idx]; delete selectedVersion[idx];
  noteChanged();
  render();
}
function switchMedia(idx, type){
  selectedMedia[idx] = type;
  delete selectedVersion[idx];
  delete pendingMarker[idx];
  delete editingComment[idx];
  refreshSongCard(idx);
}
function askVersionDetails(type, versionDefault){
  const version = prompt('Nombre de la versión (ej. ' + versionDefault + ')', versionDefault) || '';
  const fecha = prompt('Fecha (texto libre, ej. 20 Agosto 2026)', new Date().toISOString().slice(0,10)) || '';
  let extra;
  if(type === 'audio'){
    extra = { audioFile: (prompt('Nombre exacto del archivo de audio (súbelo antes a la carpeta audio/ del artista en el repo)', '') || '').trim() };
  }else{
    extra = { youtubeId: parseYouTubeId(prompt('Enlace o ID de YouTube (el vídeo debe estar en modo "Oculto", no "Privado")', '') || '') };
  }
  return Object.assign({ id:uid(), version:version.trim(), versionDate:fecha.trim(), comments:[] }, extra);
}
function addMediaBlock(idx, type){
  const song = songs[idx];
  const ver = askVersionDetails(type, type === 'audio' ? 'Pre-mix v1' : 'Corte v1');
  if(!ver.version){ return; }
  song[type] = { activeVersionId: ver.id, versions: [ver] };
  selectedMedia[idx] = type;
  selectedVersion[idx] = ver.id;
  refreshSongCard(idx);
  noteChanged();
}
function addVersion(idx){
  const type = currentMediaType(idx);
  const block = getMediaBlock(idx);
  if(!block) return;
  const ver = askVersionDetails(type, (type === 'audio' ? 'Pre-mix v' : 'Corte v') + (block.versions.length + 1));
  if(!ver.version) return;
  block.versions.push(ver);
  block.activeVersionId = ver.id;
  selectedVersion[idx] = ver.id;
  refreshSongCard(idx);
  noteChanged();
}
function startEditVersion(idx){
  const type = currentMediaType(idx);
  const ver = getSelectedVersion(idx);
  if(!ver) return;
  const label = prompt('Nombre de la versión', ver.version || '');
  if(label === null) return;
  const fecha = prompt('Fecha (texto libre)', ver.versionDate || '');
  if(fecha === null) return;
  if(type === 'audio'){
    const archivo = prompt('Nombre exacto del archivo de audio', ver.audioFile || '');
    if(archivo === null) return;
    ver.audioFile = archivo.trim();
  }else{
    const enlace = prompt('Enlace o ID de YouTube', ver.youtubeId || '');
    if(enlace === null) return;
    ver.youtubeId = parseYouTubeId(enlace);
  }
  ver.version = label.trim(); ver.versionDate = fecha.trim();
  refreshSongCard(idx);
  noteChanged();
}
function deleteVersion(idx){
  const type = currentMediaType(idx);
  const song = songs[idx];
  const block = getMediaBlock(idx);
  if(!block) return;
  const ver = getSelectedVersion(idx);
  const label = type === 'audio' ? 'audio' : 'vídeo';
  if(block.versions.length <= 1){
    if(!confirm(`Es la única versión de ${label} de esta canción. ¿Eliminar todo el bloque de ${label}?`)) return;
    song[type] = null;
    delete selectedMedia[idx];
    delete selectedVersion[idx];
    refreshSongCard(idx);
    noteChanged();
    return;
  }
  if(!confirm(`¿Eliminar la versión "${ver.version}" y sus recomendaciones? No se puede deshacer.`)) return;
  block.versions = block.versions.filter(v => v.id !== ver.id);
  if(block.activeVersionId === ver.id) block.activeVersionId = block.versions[block.versions.length - 1].id;
  delete selectedVersion[idx];
  refreshSongCard(idx);
  noteChanged();
}
function restoreVersion(idx){
  const block = getMediaBlock(idx);
  const ver = getSelectedVersion(idx);
  if(!block || !ver) return;
  if(!confirm(`¿Marcar "${ver.version}" como la versión actual? El artista la verá por defecto al entrar.`)) return;
  block.activeVersionId = ver.id;
  refreshSongCard(idx);
  noteChanged();
}

/* ---- render ---- */
function renderMediaTabs(idx){
  const song = songs[idx];
  const current = currentMediaType(idx);
  const hasAudio = !!song.audio, hasVideo = !!song.video;
  if(!officeMode && (!hasAudio || !hasVideo)) return '';
  const tabs = [];
  if(hasAudio) tabs.push(`<button type="button" class="media-tab ${current==='audio'?'selected':''}" onclick="switchMedia(${idx},'audio')">🎧 Audio</button>`);
  else if(officeMode) tabs.push(`<button type="button" class="media-tab media-tab-add" onclick="addMediaBlock(${idx},'audio')">+ Audio</button>`);
  if(hasVideo) tabs.push(`<button type="button" class="media-tab ${current==='video'?'selected':''}" onclick="switchMedia(${idx},'video')">🎬 Vídeo</button>`);
  else if(officeMode) tabs.push(`<button type="button" class="media-tab media-tab-add" onclick="addMediaBlock(${idx},'video')">+ Vídeo</button>`);
  return `<div class="media-tabs">${tabs.join('')}</div>`;
}
function renderVersionTabs(idx){
  const block = getMediaBlock(idx);
  if(!block) return '';
  const versions = block.versions || [];
  const selId = selectedVersion[idx] || block.activeVersionId;
  return `<div class="version-tabs">
    ${versions.map(v => `<button type="button" class="ver-tab ${v.id===selId?'selected':''}" onclick="switchVersionTab(${idx},'${v.id}')">${escapeHtml(v.version || 'Versión')}${v.id===block.activeVersionId?' <span class="ver-dot" title="Versión actual">●</span>':''}</button>`).join('')}
    ${officeMode ? `<button type="button" class="ver-tab ver-tab-add" onclick="addVersion(${idx})">+ Nueva versión</button>` : ''}
  </div>`;
}
function switchVersionTab(idx, versionId){
  selectedVersion[idx] = versionId;
  delete pendingMarker[idx];
  delete editingComment[idx];
  refreshSongCard(idx);
}

function renderSongCard(idx){
  return `<div class="song-card" id="song-card-${idx}">${renderSongCardInner(idx)}</div>`;
}
function renderSongCardInner(idx){
  const song = songs[idx];
  const type = currentMediaType(idx);
  const block = getMediaBlock(idx);
  const ver = getSelectedVersion(idx);
  const isActive = isActiveVersion(idx);
  const hasMediaFile = !!(ver && (type === 'audio' ? ver.audioFile : ver.youtubeId));
  const seed = ver ? escapeHtml(ver.id) : '';
  return `
    <div class="song-head">
      <div>
        <div class="song-eyebrow">Canción</div>
        <div class="song-title">${escapeHtml(song.songName || 'Sin título')}</div>
      </div>
      ${officeMode ? `<div class="song-office-controls">
        <button type="button" class="icon-btn" onclick="startEditSong(${idx})" title="Renombrar canción">✎</button>
        <button type="button" class="icon-btn" onclick="deleteSong(${idx})" title="Eliminar canción">🗑</button>
      </div>` : ''}
    </div>
    ${renderMediaTabs(idx)}
    ${!block ? `<div class="no-media">${officeMode ? 'Todavía no hay audio ni vídeo — usa "+ Audio" o "+ Vídeo" arriba.' : 'Esta canción todavía no tiene material listo para revisar.'}</div>` : `
    ${renderVersionTabs(idx)}
    <div class="version-meta-row">
      <div class="meta-box"><span class="meta-label">${isActive ? 'Versión actual' : 'Versión anterior'}</span><span class="meta-value">${escapeHtml(ver.version || '—')}</span></div>
      <div class="meta-box"><span class="meta-label">Fecha</span><span class="meta-value">${escapeHtml(ver.versionDate || '—')}</span></div>
      ${officeMode ? `
        <button type="button" class="icon-btn" onclick="startEditVersion(${idx})" title="Editar esta versión">✎</button>
        <button type="button" class="icon-btn" onclick="deleteVersion(${idx})" title="Eliminar esta versión">🗑</button>
      ` : ''}
    </div>
    ${!isActive ? `<div class="old-version-banner">
      <span>📜 Estás viendo ${escapeHtml(ver.version || 'una versión')} — no es la actual, es solo consulta.</span>
      ${officeMode ? `<button type="button" class="btn-mini btn-mini-primary" onclick="restoreVersion(${idx})">↺ Restaurar como actual</button>` : ''}
    </div>` : ''}
    ${!hasMediaFile ? `<div class="no-media">${type==='audio' ? '🎵 Audio pendiente de subir por la oficina.' : '🎬 Vídeo pendiente de subir por la oficina.'}</div>` : (type === 'audio' ? `
    <div class="player">
      <div class="transport">
        <button type="button" class="play-btn" data-idx="${idx}" onclick="togglePlay(${idx})">▶</button>
        <span class="time-cur" data-idx="${idx}">0:00</span>
        <span class="time-sep">/</span>
        <span class="time-dur" data-idx="${idx}">--:--</span>
        <div class="volume"><span>🔊</span><input type="range" class="vol-range" min="0" max="1" step="0.01" value="1" oninput="volInput(${idx},this.value)"></div>
      </div>
      <div class="wave-wrap">
        <div class="markers-row" data-idx="${idx}"></div>
        <canvas class="wave-canvas" data-idx="${idx}" data-seed="${seed}" width="1000" height="64"></canvas>
        <input type="range" class="seek-range" data-idx="${idx}" min="0" max="100" step="0.1" value="0" oninput="seekInput(${idx},this.value)">
      </div>
      <audio class="audio-el" data-idx="${idx}" src="${escapeHtml(resolveAudioSrc(ver))}" preload="metadata"
        ontimeupdate="onTimeUpdate(${idx},this)"
        onloadedmetadata="onAudioReady(${idx},this)"
        onplay="setPlayIcon(${idx},true)"
        onpause="setPlayIcon(${idx},false)"
        onended="setPlayIcon(${idx},false)"
        onerror="onAudioError(${idx})"></audio>
    </div>
    ` : `
    <div class="yt-wrap"><div id="yt-embed-${idx}"></div></div>
    <div class="mini-timeline">
      <div class="mini-track" onclick="miniSeek(event,${idx})"></div>
      <div class="markers-row" data-idx="${idx}"></div>
    </div>
    `)}
    ${(hasMediaFile && isActive) ? `<button type="button" class="btn-add-marker" onclick="startAddMarker(${idx})">+ Añadir marcador${type==='video' ? ' (en el momento actual del vídeo)' : ''}</button>` : ''}
    ${hasMediaFile ? `<div class="add-marker-form" data-idx="${idx}" hidden></div><div class="comments-list" data-idx="${idx}"></div>` : ''}
    `}
  `;
}

/* ---- guardado ---- */
function noteChanged(){
  const note = document.getElementById('savedNote');
  if(note){ note.className = 'saved-note local'; note.textContent = '📝 Cambios sin enviar — toca "Enviar cambios al equipo"'; }
}
async function guardar(){
  const note = document.getElementById('savedNote');
  const btn = document.getElementById('btnGuardar');
  if(!expediente){ note.className = 'saved-note err'; note.textContent = 'Sin expediente cargado'; return; }
  if(!WEBHOOK){ note.className = 'saved-note err'; note.textContent = 'Publicador no configurado'; return; }
  btn.disabled = true; note.className = 'saved-note'; note.textContent = 'Enviando…';
  try{
    const payload = Object.assign({}, expediente, { songReviews: songs.map(stripTransient), updatedAt: new Date().toISOString().slice(0,10) });
    // text/plain evita el preflight CORS de las webapps de Apps Script
    const r = await fetch(WEBHOOK, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
    const body = await r.json().catch(() => null);
    if(r.ok && body && body.status === 'ok'){
      note.className = 'saved-note ok'; note.textContent = '✓ Enviado — la oficina ya lo ve';
    }else{
      throw new Error((body && body.message) || r.status);
    }
  }catch(e){
    note.className = 'saved-note err'; note.textContent = '✗ No se pudo enviar (queda guardado en este dispositivo)';
  }finally{ btn.disabled = false; }
}

init();
</script>
